---
# Filet de sécurité mémoire : sans swap, Linux tue Ollama dès que la RAM est pleine
- name: Créer un fichier d'échange de 2 Go
  ansible.builtin.command: fallocate -l 2G /swapfile
  args:
    creates: /swapfile
  register: ollama_swapfile
  when: ansible_facts['swaptotal_mb'] | int < 1024

- name: Protéger le fichier d'échange
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"
  when: ollama_swapfile is changed

- name: Formater et activer le fichier d'échange
  ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
  when: ollama_swapfile is changed

- name: Activer le fichier d'échange au démarrage
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
  when: ollama_swapfile is changed

- name: Utiliser le swap seulement en dernier recours
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_file: /etc/sysctl.d/99-swap.conf
    reload: true

- name: Télécharger le script d'installation officiel d'Ollama
  ansible.builtin.get_url:
    url: https://ollama.com/install.sh
    dest: /tmp/ollama-install.sh
    mode: "0755"

- name: Installer Ollama
  ansible.builtin.command: sh /tmp/ollama-install.sh
  args:
    creates: /usr/local/bin/ollama

- name: Créer le dossier de configuration systemd d'Ollama
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: "0755"

- name: Limiter la consommation mémoire d'Ollama
  ansible.builtin.copy:
    dest: /etc/systemd/system/ollama.service.d/override.conf
    mode: "0644"
    content: |
      # Géré par Ansible
      [Service]
      # Une seule analyse à la fois et un seul modèle en mémoire
      Environment="OLLAMA_NUM_PARALLEL=1"
      Environment="OLLAMA_MAX_LOADED_MODELS=1"
      # Garder le modèle chargé entre deux analyses d'un même build
      Environment="OLLAMA_KEEP_ALIVE=30m"
  notify:
    - Reload systemd
    - Restart ollama

- name: Démarrer Ollama au boot (écoute uniquement sur 127.0.0.1)
  ansible.builtin.service:
    name: ollama
    state: started
    enabled: true

- name: Appliquer la nouvelle configuration d'Ollama
  ansible.builtin.meta: flush_handlers

- name: Lister les modèles déjà présents
  ansible.builtin.command: ollama list
  register: ollama_models
  changed_when: false
  retries: 10
  delay: 3
  until: ollama_models.rc == 0

- name: Télécharger le modèle d'IA (environ 2 Go, plusieurs minutes)
  ansible.builtin.command: "ollama pull {{ ollama_model }}"
  when: ollama_model not in ollama_models.stdout
