---
- name: Autoriser les ports nécessaires
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ allowed_tcp_ports }}"

- name: Refuser tout le trafic entrant par défaut
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Autoriser tout le trafic sortant par défaut
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Activer le pare-feu
  community.general.ufw:
    state: enabled
