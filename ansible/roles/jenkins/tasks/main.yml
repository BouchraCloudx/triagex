---
- name: Installer Java 21 (requis par Jenkins)
  ansible.builtin.apt:
    name:
      - fontconfig
      - openjdk-21-jre-headless
    state: present
    update_cache: true
    lock_timeout: 600

- name: Ajouter le dépôt officiel Jenkins LTS
  ansible.builtin.deb822_repository:
    name: jenkins
    types: deb
    uris: https://pkg.jenkins.io/debian-stable
    suites: binary/
    signed_by: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    state: present

- name: Installer Jenkins
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: true
    lock_timeout: 600

- name: Autoriser Jenkins à utiliser Docker
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  notify: Restart jenkins

- name: Créer le dossier de configuration systemd
  ansible.builtin.file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    mode: "0755"

- name: Configurer les options de démarrage de Jenkins
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/jenkins.service.d/override.conf
    mode: "0644"
  notify:
    - Reload systemd
    - Restart jenkins

- name: Télécharger l'outil d'installation des plugins
  ansible.builtin.get_url:
    url: "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ jenkins_plugin_manager_version }}/jenkins-plugin-manager-{{ jenkins_plugin_manager_version }}.jar"
    dest: /opt/jenkins-plugin-manager.jar
    mode: "0644"

- name: Déployer la liste des plugins
  ansible.builtin.copy:
    src: plugins.txt
    dest: "{{ jenkins_home }}/plugins.txt"
    owner: jenkins
    group: jenkins
    mode: "0644"
  notify:
    - Install jenkins plugins
    - Fix plugins ownership
    - Restart jenkins

- name: Déployer la configuration JCasC
  ansible.builtin.template:
    src: casc.yaml.j2
    dest: "{{ jenkins_home }}/casc.yaml"
    owner: jenkins
    group: jenkins
    mode: "0600"
  notify: Restart jenkins

# --- Accès Ansible pour le contrôle de conformité nocturne ---------------------------------

- name: Créer le dossier SSH de Jenkins
  ansible.builtin.file:
    path: "{{ jenkins_home }}/.ssh"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0700"

- name: Générer la clé SSH de Jenkins (une seule fois)
  ansible.builtin.command: >
    ssh-keygen -t ed25519 -N "" -C "jenkins@cicd" -f {{ jenkins_home }}/.ssh/id_ed25519
  args:
    creates: "{{ jenkins_home }}/.ssh/id_ed25519"

- name: Donner la clé SSH à l'utilisateur jenkins
  ansible.builtin.file:
    path: "{{ jenkins_home }}/.ssh/{{ item.name }}"
    owner: jenkins
    group: jenkins
    mode: "{{ item.mode }}"
  loop:
    - { name: id_ed25519, mode: "0600" }
    - { name: id_ed25519.pub, mode: "0644" }

- name: Lire la clé publique de Jenkins
  ansible.builtin.slurp:
    src: "{{ jenkins_home }}/.ssh/id_ed25519.pub"
  register: jenkins_pubkey_file

- name: Mémoriser la clé publique de Jenkins
  ansible.builtin.set_fact:
    jenkins_ssh_pubkey: "{{ jenkins_pubkey_file.content | b64decode | trim }}"

- name: Donner à Jenkins le mot de passe Vault (pour lire les variables chiffrées)
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/.vault_pass') }}\n"
    dest: "{{ jenkins_home }}/.vault_pass"
    owner: jenkins
    group: jenkins
    mode: "0600"
  no_log: true

# -------------------------------------------------------------------------------------------

- name: Démarrer Jenkins au boot
  ansible.builtin.service:
    name: jenkins
    state: started
    enabled: true

- name: Appliquer les changements en attente
  ansible.builtin.meta: flush_handlers

- name: Attendre que Jenkins soit disponible
  ansible.builtin.uri:
    url: "http://localhost:8080/login"
    status_code: 200
  register: jenkins_ready
  until: jenkins_ready.status == 200
  retries: 30
  delay: 10
