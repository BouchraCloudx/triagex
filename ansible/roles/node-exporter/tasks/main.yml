---
# node_exporter publie les métriques système (CPU, RAM, disque) lues par Prometheus.
# Réseau de l'hôte : le port est filtré par UFW (pas de contournement par Docker).
- name: Installer le SDK Docker pour Python
  ansible.builtin.apt:
    name: python3-docker
    state: present
    lock_timeout: 600

- name: Lancer node_exporter
  community.docker.docker_container:
    name: node-exporter
    image: "{{ node_exporter_image | default('prom/node-exporter:v1.8.1') }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    pid_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opts:
      - no-new-privileges:true
    memory: 64m
    volumes:
      - "/:/host:ro,rslave"
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address={{ node_exporter_listen }}"

- name: Attendre que node_exporter réponde
  ansible.builtin.uri:
    url: "http://{{ node_exporter_listen }}/metrics"
    return_content: false
  register: node_exporter_check
  until: node_exporter_check.status == 200
  retries: 10
  delay: 3
