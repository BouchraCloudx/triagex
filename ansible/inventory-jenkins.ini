# Inventaire utilisé par Jenkins (contrôle de conformité nocturne).
# Jenkins se connecte aux deux machines en SSH, avec sa propre clé, en tant que devops.
# Mêmes groupes que inventory.ini : les mêmes variables s'appliquent.
[ci_servers]
cicd ansible_host=192.168.138.10

[ai_servers]
ai-app ansible_host=192.168.138.11

[all:vars]
ansible_python_interpreter=/usr/bin/python3
